<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator App</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            background-color: black;
            color: white;
            font-size: 22px;
            padding: 8px;
            margin: 0 0 20px;
        }

        h3 {
            font-size: 16px;
        }

        input {
            width: 70px;
            padding: 6px;
            text-align: left;
        }

        label {
            font-weight: bold;
            margin: 0 12px;
        }

        #evaluate {
            background-color: navy;
            color: white;
            border: none;
            padding: 10px 14px;
            margin: 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .box {
            display: inline-block;
            min-width: 80px;
            padding: 12px;
            margin: 6px;
            color: white;
            text-align: left;
        }

        #rentBox, #emergencyBox {
            background-color: blue;
        }

        #accessoriesBox {
            background-color: green;
        }

        #savingBox {
            background-color: deeppink;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("#evaluate").click(function () {
                let amount = parseFloat($("#amount").val());
                let rent = parseFloat($("#rent").val());
                let accessories = parseFloat($("#accessories").val());
                let emergency = parseFloat($("#emergency").val());
                let saving = parseFloat($("#saving").val());

                // All the fields must contain valid values
                if (isNaN(amount) || isNaN(rent) || isNaN(accessories) ||
                    isNaN(emergency) || isNaN(saving) || amount <= 0 ||
                    rent < 0 || accessories < 0 || emergency < 0 || saving < 0) {
                    alert("Please enter a valid amount and valid percentages.");
                    return;
                }

                // The amount can be divided only if the percentages total 100
                let total = rent + accessories + emergency + saving;
                if (total !== 100) {
                    alert("Amount cannot be divided. The total percentage is " +
                        total + "%. It must be 100%.");
                    $(".box span").text("Rs.0");
                    return;
                }

                $("#rentValue").text("Rs." + (amount * rent / 100));
                $("#accessoriesValue").text("Rs." + (amount * accessories / 100));
                $("#emergencyValue").text("Rs." + (amount * emergency / 100));
                $("#savingValue").text("Rs." + (amount * saving / 100));
            });
        });
    </script>
</head>
<body>
    <h1>Budget Calculator App</h1>

    <h3>Enter Amount that you want to Manage</h3>
    <input type="number" id="amount" value="15000">

    <h3>How would you like to divide your money?</h3>
    <label>Room Rent(%): <input type="number" id="rent" value="50"></label>
    <label>Accessories(%): <input type="number" id="accessories" value="20"></label>
    <label>Emergency(%): <input type="number" id="emergency" value="20"></label>
    <label>Saving(%): <input type="number" id="saving" value="10"></label>

    <br>
    <button id="evaluate">Evaluate My Money</button>
    <br>

    <div class="box" id="rentBox">Room Rent<br><span id="rentValue">Rs.0</span></div>
    <div class="box" id="accessoriesBox">Accessories<br><span id="accessoriesValue">Rs.0</span></div>
    <div class="box" id="emergencyBox">Emergency<br><span id="emergencyValue">Rs.0</span></div>
    <div class="box" id="savingBox">Saving<br><span id="savingValue">Rs.0</span></div>
</body>
</html>
