<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comment Box</title>
    <script src="https://code.angularjs.org/1.6.9/angular.min.js"></script>
    <script>
        // Controller registered in a module (required from AngularJS 1.3 onwards)
        angular.module("commentApp", []).controller("FrmController", function ($scope) {
            $scope.comment = [];

            $scope.btn_add = function () {
                if ($scope.txtcomment) {
                    $scope.comment.push($scope.txtcomment);
                    $scope.txtcomment = "";
                }
            };

            $scope.remItem = function ($index) {
                $scope.comment.splice($index, 1);
            };
        });
    </script>
</head>
<body ng-app="commentApp">
    <div id="dv1">
        <form ng-controller="FrmController">
            Post your Comment<br>
            <textarea ng-model="txtcomment" placeholder="Your Comment" style="width:550px"></textarea><br>
            <button type="button" ng-click="btn_add()" style="margin-top:10px;">Post Comment</button>
            <h4>Comments</h4>
            <ul style="width:550px">
                <li ng-repeat="comnt in comment track by $index">
                    {{ comnt }} <a style="float:right;" href="" ng-click="remItem($index)">x</a>
                </li>
            </ul>
        </form>
    </div>
</body>
</html>
