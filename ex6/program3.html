<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Font Size Events</title>
</head>
<body>
    <h2>Mouse Events</h2>
    <p id="text" style="font-size: 16px;"
        onmouseover="changeSize('28px')" onmouseout="changeSize('16px')">
        Move the mouse over this paragraph.
    </p>

    <script>
        function changeSize(size) {
            document.getElementById("text").style.fontSize = size;
        }
    </script>
</body>
</html>
